apiVersion: apps/v1
kind: Deployment
metadata: { name: compliance-atlas, labels: { app: compliance-atlas } }
spec:
  replicas: 1
  selector: { matchLabels: { app: compliance-atlas } }
  template:
    metadata: { labels: { app: compliance-atlas } }
    spec:
      containers:
        - name: compliance-atlas
          image: ghcr.io/cognis-digital/compliance-atlas:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: compliance-atlas }
spec:
  selector: { app: compliance-atlas }
  ports: [{ port: 80, targetPort: 8000 }]
